<svg xmlns='http://www.w3.org/2000/svg' width='640' height='260' viewBox='0 0 640 260'>
  <title>Neuron</title>
  <rect x='0' y='0' width='100%' height='100%' fill='white'/>
  <style>
    .node { fill: #f2f2f2; stroke: #333; stroke-width: 1.5; }
    .sum { fill: #fff3cd; stroke: #b08900; stroke-width: 1.5; }
    .act { fill: #e7f5ff; stroke: #1b6ca8; stroke-width: 1.5; }
    .text { font: 14px sans-serif; fill: #333; }
    .small { font: 12px sans-serif; fill: #333; }
    .line { stroke: #555; stroke-width: 1.5; }
    .arrow { marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id='arrow' markerWidth='10' markerHeight='10' refX='9' refY='3' orient='auto'>
      <path d='M0,0 L10,3 L0,6 Z' fill='#555'/>
    </marker>
  </defs>

  <circle class='node' cx='80' cy='70' r='24'/>
  <text class='text' x='80' y='75' text-anchor='middle'>x1</text>

  <circle class='node' cx='80' cy='150' r='24'/>
  <text class='text' x='80' y='155' text-anchor='middle'>x2</text>

  <line class='line arrow' x1='104' y1='70' x2='220' y2='100'/>
  <line class='line arrow' x1='104' y1='150' x2='220' y2='120'/>

  <text class='small' x='150' y='80' text-anchor='middle'>w1</text>
  <text class='small' x='150' y='150' text-anchor='middle'>w2</text>

  <ellipse class='sum' cx='260' cy='110' rx='45' ry='30'/>
  <text class='text' x='260' y='114' text-anchor='middle'>sum + b</text>

  <line class='line arrow' x1='305' y1='110' x2='385' y2='110'/>

  <rect class='act' x='395' y='85' width='80' height='50' rx='6' ry='6'/>
  <text class='text' x='435' y='115' text-anchor='middle'>f(·)</text>

  <line class='line arrow' x1='475' y1='110' x2='545' y2='110'/>

  <circle class='node' cx='580' cy='110' r='24'/>
  <text class='text' x='580' y='115' text-anchor='middle'>y</text>

  <text class='small' x='260' y='175' text-anchor='middle'>y = f(w1·x1 + w2·x2 + b)</text>
</svg>
